services:
  postgres:
    image: postgres:16-alpine
    container_name: fml-postgres
    environment:
      POSTGRES_DB: fml
      POSTGRES_USER: fml
      POSTGRES_PASSWORD: fml
    ports:
      - "5432:5432"
    volumes:
      - fml-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fml -d fml"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fml-pgdata:
